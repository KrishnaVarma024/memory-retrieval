[project]
name = "memret"
version = "0.1.0"
description = "Retrieval and long-term memory for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "PyStemmer>=2.2",
]

[project.optional-dependencies]
# Phase 2 onwards: the embedding model and vector search. Phase 1 commands run without them.
dense = [
    "torch>=2.4",
    "transformers>=4.44",
    "faiss-cpu>=1.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# On Linux, take torch's CPU-only build: the default one pulls in several GB of CUDA libraries.
# macOS wheels on PyPI are already CPU (and Apple GPU) builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memret"]

[tool.pytest.ini_options]
testpaths = ["tests"]
