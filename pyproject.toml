[project]
name = "memret"
version = "0.1.0"
description = "Retrieval and long-term memory for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "PyStemmer>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memret"]

[tool.pytest.ini_options]
testpaths = ["tests"]
